<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-label="Currency Converter UI overview: main screen and quick settings dialog">
  <defs>
    <filter id="phoneShadow" x="-30%" y="-15%" width="160%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26262B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#26262B" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .page-title { font-size: 40px; font-weight: 700; fill: #F4F4F6; letter-spacing: -1px; }
      .page-sub { font-size: 16px; fill: #9CA3AF; }
      .status-bar { font-size: 9px; font-weight: 600; fill: #9CA3AF; }
      .phone-screen { fill: #0B0B0C; }
      .app-title { font-size: 19px; font-weight: 600; fill: #F4F4F6; }
      .app-sub { font-size: 9px; fill: #9CA3AF; }
      .card { fill: #17171A; stroke: #26262B; stroke-width: 1; }
      .pill { fill: #222226; }
      .label { font-size: 8.5px; fill: #9CA3AF; }
      .label-small { font-size: 7.5px; fill: #9CA3AF; }
      .amount { font-size: 22px; font-weight: 700; fill: #F4F4F6; letter-spacing: -0.4px; }
      .result { font-size: 30px; font-weight: 700; fill: #F4F4F6; letter-spacing: -0.8px; }
      .currency-code { font-size: 15px; font-weight: 600; fill: #F4F4F6; }
      .currency-name { font-size: 10px; fill: #9CA3AF; }
      .hint { font-size: 9px; fill: #E4E4E7; }
      .rate { font-size: 9px; fill: #9CA3AF; }
      .status { font-size: 8.5px; fill: #F4F4F6; }
      .status-sub { font-size: 7.5px; fill: #9CA3AF; }
      .op-text { font-size: 12px; fill: #E4E4E7; text-anchor: middle; }
      .swap-text { font-size: 13px; fill: #F4F4F6; text-anchor: middle; }
      .chevron { font-size: 12px; fill: #9CA3AF; }
      .tile-title { font-size: 10.5px; font-weight: 600; fill: #F4F4F6; }
      .tile-text { font-size: 7.5px; fill: #9CA3AF; }
      .tile-button-text { font-size: 8px; font-weight: 600; fill: #E4E4E7; text-anchor: middle; }
      .dialog-title { font-size: 16px; font-weight: 600; fill: #F4F4F6; }
      .dialog-code { font-size: 12px; font-weight: 600; fill: #F4F4F6; }
      .dialog-label { font-size: 7.5px; fill: #9CA3AF; }
      .dialog-amount { font-size: 20px; font-weight: 700; fill: #F4F4F6; letter-spacing: -0.3px; }
      .dialog-result { font-size: 28px; font-weight: 700; fill: #F4F4F6; letter-spacing: -0.7px; }
      .caption { font-size: 14px; font-weight: 600; fill: #E4E4E7; text-anchor: middle; }
      .footnote { font-size: 11px; fill: #9CA3AF; text-anchor: middle; }
      .glyph { font-size: 10px; fill: #E4E4E7; text-anchor: middle; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="850" fill="#0B0B0C"/>
  <circle cx="1090" cy="110" r="220" fill="url(#glow)"/>
  <circle cx="90" cy="770" r="200" fill="url(#glow)" opacity="0.7"/>

  <text x="70" y="68" class="page-title">Currency Converter</text>
  <text x="70" y="96" class="page-sub">Jetpack Compose · Material 3 · reference rates · built-in math</text>

  <!-- ============================ MAIN SCREEN ============================ -->
  <g filter="url(#phoneShadow)">
    <rect x="130" y="140" width="360" height="650" rx="46" fill="#000000" stroke="#26262B" stroke-width="1"/>
    <rect x="144" y="154" width="332" height="622" rx="36" class="phone-screen"/>
  </g>

  <!-- Status bar -->
  <text x="166" y="176" class="status-bar">9:41</text>
  <circle cx="440" cy="172" r="2" fill="#9CA3AF"/>
  <circle cx="448" cy="172" r="2" fill="#9CA3AF"/>
  <rect x="414" y="168" width="16" height="8" rx="2" fill="none" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="416" y="170" width="10" height="4" rx="1" fill="#9CA3AF"/>

  <!-- App bar (no duplicate refresh action) -->
  <text x="166" y="217" class="app-title">Currency Converter</text>
  <text x="166" y="233" class="app-sub">Reference rates · works offline</text>

  <!-- From card -->
  <rect x="164" y="246" width="292" height="172" rx="22" class="card"/>

  <!-- Lightweight selector header row (no box inside the card) -->
  <text x="180" y="266" class="label">From</text>
  <text x="180" y="290" class="currency-code">EUR</text>
  <text x="216" y="290" class="currency-name">Euro</text>
  <text x="434" y="289" class="chevron" text-anchor="middle">⌄</text>

  <text x="180" y="318" class="label">Amount or expression</text>
  <text x="180" y="346" class="amount">12.5 * (3 + 2)</text>
  <text x="180" y="362" class="hint">= 62.5</text>

  <!-- Operator row -->
  <g>
    <rect x="180" y="374" width="40" height="24" rx="8" class="pill"/><text x="200" y="390" class="op-text">+</text>
    <rect x="224" y="374" width="40" height="24" rx="8" class="pill"/><text x="244" y="390" class="op-text">−</text>
    <rect x="268" y="374" width="40" height="24" rx="8" class="pill"/><text x="288" y="390" class="op-text">×</text>
    <rect x="312" y="374" width="40" height="24" rx="8" class="pill"/><text x="332" y="390" class="op-text">÷</text>
    <rect x="356" y="374" width="40" height="24" rx="8" class="pill"/><text x="376" y="390" class="op-text">(</text>
    <rect x="400" y="374" width="40" height="24" rx="8" class="pill"/><text x="420" y="390" class="op-text">)</text>
  </g>

  <!-- To card: 10dp gap, swap button straddles the shared seam -->
  <rect x="164" y="428" width="292" height="174" rx="22" class="card"/>

  <circle cx="310" cy="423" r="22" fill="#222226" stroke="#26262B" stroke-width="1"/>
  <text x="310" y="428" class="swap-text">⇅</text>

  <text x="180" y="452" class="label">To</text>
  <text x="180" y="476" class="currency-code">USD</text>
  <text x="216" y="476" class="currency-name">United States Dollar</text>
  <text x="434" y="475" class="chevron" text-anchor="middle">⌄</text>

  <text x="180" y="506" class="label">Converted amount</text>
  <text x="180" y="540" class="result">68.84</text>
  <text x="404" y="540" class="currency-code" font-size="13">USD</text>
  <text x="180" y="560" class="rate">1 EUR = 1.1014 USD</text>

  <!-- Sync status pill: whole pill is the refresh button -->
  <rect x="164" y="616" width="292" height="48" rx="16" class="card"/>
  <circle cx="186" cy="640" r="9" class="pill"/>
  <text x="186" y="643" class="glyph">✓</text>
  <text x="202" y="637" class="status">Updated just now</text>
  <text x="202" y="650" class="status-sub">Reference rates · 17 Nov 2026</text>

  <!-- Dismissible Quick Settings promo -->
  <rect x="164" y="676" width="292" height="86" rx="18" class="card"/>
  <circle cx="188" cy="706" r="14" class="pill"/>
  <text x="188" y="710" class="glyph">▦</text>
  <text x="210" y="700" class="tile-title">Quick Settings tile</text>
  <text x="435" y="700" class="chevron" text-anchor="middle">×</text>
  <text x="210" y="714" class="tile-text">One-tap access from anywhere.</text>
  <text x="210" y="725" class="tile-text">Add it from the panel.</text>
  <rect x="210" y="732" width="78" height="22" rx="11" fill="#222226" stroke="#26262B" stroke-width="1"/>
  <text x="249" y="746" class="tile-button-text">Add tile</text>

  <text x="310" y="822" class="caption">Main converter</text>

  <!-- ============================ QUICK DIALOG ============================ -->
  <g filter="url(#phoneShadow)">
    <rect x="710" y="140" width="360" height="650" rx="46" fill="#000000" stroke="#26262B" stroke-width="1"/>
    <rect x="724" y="154" width="332" height="622" rx="36" class="phone-screen"/>
  </g>

  <!-- Dimmed app behind the dialog -->
  <rect x="724" y="154" width="332" height="622" rx="36" fill="#000000" opacity="0.62"/>
  <rect x="748" y="188" width="284" height="84" rx="22" fill="#17171A" opacity="0.85"/>
  <rect x="748" y="292" width="284" height="72" rx="22" fill="#17171A" opacity="0.7"/>

  <!-- Dialog card -->
  <g filter="url(#cardShadow)">
    <rect x="744" y="224" width="292" height="372" rx="28" fill="#17171A" stroke="#26262B" stroke-width="1"/>
  </g>

  <text x="764" y="262" class="dialog-title">Quick convert</text>
  <text x="764" y="276" class="dialog-label">Reference rates · works offline</text>
  <text x="1008" y="262" class="chevron" text-anchor="middle" font-size="17">×</text>

  <!-- Currency pills -->
  <rect x="764" y="290" width="100" height="46" rx="14" class="pill"/>
  <text x="776" y="305" class="dialog-label">From</text>
  <text x="776" y="325" class="dialog-code">EUR</text>
  <text x="844" y="324" class="chevron" text-anchor="middle" font-size="10">⌄</text>

  <circle cx="886" cy="313" r="16" fill="#222226" stroke="#26262B" stroke-width="1"/>
  <text x="886" y="318" class="swap-text" font-size="11">⇅</text>

  <rect x="904" y="290" width="112" height="46" rx="14" class="pill"/>
  <text x="916" y="305" class="dialog-label">To</text>
  <text x="916" y="325" class="dialog-code">USD</text>
  <text x="994" y="324" class="chevron" text-anchor="middle" font-size="10">⌄</text>

  <!-- Amount -->
  <text x="764" y="362" class="dialog-label">Amount or expression</text>
  <text x="764" y="390" class="dialog-amount">12.5 * (3 + 2)</text>
  <text x="764" y="406" class="hint">= 62.5</text>

  <!-- Operator row -->
  <g>
    <rect x="764" y="418" width="40" height="22" rx="7" class="pill"/><text x="784" y="433" class="op-text" font-size="11">+</text>
    <rect x="808" y="418" width="40" height="22" rx="7" class="pill"/><text x="828" y="433" class="op-text" font-size="11">−</text>
    <rect x="852" y="418" width="40" height="22" rx="7" class="pill"/><text x="872" y="433" class="op-text" font-size="11">×</text>
    <rect x="896" y="418" width="40" height="22" rx="7" class="pill"/><text x="916" y="433" class="op-text" font-size="11">÷</text>
    <rect x="940" y="418" width="40" height="22" rx="7" class="pill"/><text x="960" y="433" class="op-text" font-size="11">(</text>
    <rect x="984" y="418" width="24" height="22" rx="7" class="pill"/><text x="996" y="433" class="op-text" font-size="11">)</text>
  </g>

  <line x1="764" y1="452" x2="1016" y2="452" stroke="#26262B" stroke-width="1"/>

  <!-- Result -->
  <text x="764" y="472" class="dialog-label">Converted amount</text>
  <text x="764" y="504" class="dialog-result">68.84</text>
  <text x="1000" y="504" class="dialog-code" font-size="12">USD</text>
  <text x="764" y="522" class="rate">1 EUR = 1.1014 USD</text>

  <!-- Tappable sync footer (no separate refresh icon) -->
  <rect x="764" y="538" width="252" height="32" rx="12" class="pill"/>
  <circle cx="778" cy="554" r="8" fill="#17171A"/>
  <text x="778" y="557" class="glyph" font-size="8">✓</text>
  <text x="792" y="557" class="status">Updated just now</text>

  <text x="890" y="822" class="caption">Quick Settings dialog</text>

  <text x="600" y="850" class="footnote" opacity="0"> </text>
</svg>
